<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クイズメーカー</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Yu Gothic","Meiryo",sans-serif;
}

body{
    background:#eef3ff;
    color:#222;
}

header{
    background:#4d73ff;
    color:#fff;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

main{
    max-width:1200px;
    margin:20px auto;
    display:grid;
    grid-template-columns:380px 1fr;
    gap:20px;
    padding:0 15px;
}

@media(max-width:900px){
main{
grid-template-columns:1fr;
}
}

.panel{
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.panel h2{
margin-bottom:15px;
font-size:22px;
}

label{
display:block;
margin-top:12px;
margin-bottom:4px;
font-weight:bold;
}

input[type=text],
input[type=number],
textarea,
select{
width:100%;
padding:10px;
border:1px solid #bbb;
border-radius:8px;
font-size:15px;
}

textarea{
resize:vertical;
min-height:70px;
}

button{
cursor:pointer;
border:none;
padding:10px 18px;
border-radius:10px;
font-size:15px;
margin:6px 3px;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

.primary{
background:#4d73ff;
color:white;
}

.green{
background:#18a558;
color:white;
}

.red{
background:#df4343;
color:white;
}

.orange{
background:#ff9800;
color:white;
}

.gray{
background:#777;
color:white;
}

.questionCard{
border:1px solid #ccc;
border-radius:12px;
padding:12px;
margin-bottom:12px;
background:#fafafa;
}

.choiceRow{
display:flex;
gap:8px;
margin:6px 0;
}

.choiceRow input[type=text]{
flex:1;
}

.choiceRow input[type=radio]{
transform:scale(1.2);
}

#quizArea{
display:none;
}

#questionTitle{
font-size:26px;
margin-bottom:20px;
}

.answerBtn{
display:block;
width:100%;
padding:16px;
margin:10px 0;
font-size:18px;
text-align:left;
background:white;
border:2px solid #4d73ff;
border-radius:12px;
transition:.2s;
}

.answerBtn:hover{
background:#dce6ff;
}

.correct{
background:#3fb86d!important;
color:white;
}

.wrong{
background:#d94d4d!important;
color:white;
}

#result{
display:none;
text-align:center;
}

.big{
font-size:35px;
margin:15px;
}

.progress{
height:14px;
background:#ddd;
border-radius:30px;
overflow:hidden;
margin-bottom:15px;
}

.progressBar{
height:100%;
width:0%;
background:#4d73ff;
transition:.3s;
}

.small{
font-size:13px;
color:#666;
margin-top:5px;
}

.flex{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.checkbox{
margin-top:10px;
display:flex;
align-items:center;
gap:8px;
}

#importFile{
display:none;
}

pre{
background:#222;
color:#0f0;
padding:10px;
border-radius:10px;
overflow:auto;
font-size:13px;
margin-top:10px;
max-height:220px;
}
</style>
</head>

<body>

<header>
HTML1ファイル クイズメーカー
</header>

<main>

<div class="panel">

<h2>クイズ編集</h2>

<label>タイトル</label>
<input id="quizTitleInput" type="text" value="マイクイズ">

<label>説明</label>
<textarea id="quizDescription"></textarea>

<div class="flex">
<button class="primary" id="addQuestionBtn">
＋問題追加
</button>

<button class="green" id="startQuizBtn">
▶プレイ
</button>

<button class="orange" id="exportBtn">
保存
</button>

<button class="gray" onclick="document.getElementById('importFile').click()">
読込
</button>
</div>

<input id="importFile" type="file" accept=".json">

<div class="checkbox">
<input type="checkbox" id="shuffleQuestions">
<label for="shuffleQuestions">
問題をシャッフル
</label>
</div>

<div id="editor"></div>

</div>

<div class="panel">

<div id="home">

<h2>プレビュー</h2>

<p>
左側で問題を作成してください。
</p>

<pre id="previewJSON"></pre>

</div>

<div id="quizArea">

<div class="progress">
<div class="progressBar" id="progressBar"></div>
</div>

<div id="questionNumber"></div>

<h2 id="questionTitle"></h2>

<div id="answers"></div>

</div>

<div id="result">

<h2>結果</h2>

<div class="big" id="scoreText"></div>

<button class="primary" id="retryBtn">
もう一度
</button>

<button class="gray" id="backBtn">
編集画面へ
</button>

</div>

</div>

</main>

<script>

let quiz={
title:"マイクイズ",
description:"",
questions:[]
};

let playing=[];
let current=0;
let score=0;

function uid(){
return Math.random().toString(36).substring(2,10);
}

function addQuestion(data){

quiz.questions.push(data||{

id:uid(),

question:"",

choices:[
"","","",""
],

answer:0,

explanation:""

});

renderEditor();

}

function renderEditor(){

document.getElementById("previewJSON").textContent=
JSON.stringify(quiz,null,2);

const editor=document.getElementById("editor");

editor.innerHTML="";

quiz.questions.forEach((q,index)=>{

const card=document.createElement("div");

card.className="questionCard";

card.innerHTML=`

<h3>問題 ${index+1}</h3>

<label>問題文</label>

<textarea class="qText">${q.question}</textarea>

<label>選択肢</label>

<div class="choices"></div>

<label>解説</label>

<textarea class="exp">${q.explanation}</textarea>

<button class="red deleteBtn">
削除
</button>

`;

editor.appendChild(card);

const choicesDiv=card.querySelector(".choices");

for(let i=0;i<4;i++){

const row=document.createElement("div");

row.className="choiceRow";

row.innerHTML=`

<input type="radio" name="a${q.id}" ${q.answer==i?"checked":""}>

<input type="text" value="${q.choices[i]}">

`;

choicesDiv.appendChild(row);

}

});
}

document.getElementById("addQuestionBtn").onclick=()=>{
addQuestion();
};

addQuestion();
  function bindEditor(){

document.querySelectorAll(".questionCard").forEach((card,index)=>{

const q=quiz.questions[index];

card.querySelector(".qText").oninput=e=>{
q.question=e.target.value;
updatePreview();
};

card.querySelector(".exp").oninput=e=>{
q.explanation=e.target.value;
updatePreview();
};

card.querySelectorAll(".choiceRow").forEach((row,i)=>{

row.querySelector("input[type=text]").oninput=e=>{
q.choices[i]=e.target.value;
updatePreview();
};

row.querySelector("input[type=radio]").onchange=()=>{
q.answer=i;
updatePreview();
};

});

card.querySelector(".deleteBtn").onclick=()=>{

if(confirm("削除しますか？")){
quiz.questions.splice(index,1);
renderEditor();
}

};

});

}

function updatePreview(){

quiz.title=document.getElementById("quizTitleInput").value;
quiz.description=document.getElementById("quizDescription").value;

document.getElementById("previewJSON").textContent=
JSON.stringify(quiz,null,2);

}

const oldRender=renderEditor;

renderEditor=function(){

oldRender();

bindEditor();

updatePreview();

};

document.getElementById("quizTitleInput").oninput=updatePreview;
document.getElementById("quizDescription").oninput=updatePreview;

function startQuiz(){

updatePreview();

playing=JSON.parse(JSON.stringify(quiz.questions));

if(playing.length===0){

alert("問題がありません");

return;

}

if(document.getElementById("shuffleQuestions").checked){

playing.sort(()=>Math.random()-0.5);

}

current=0;
score=0;

document.getElementById("home").style.display="none";
document.getElementById("result").style.display="none";
document.getElementById("quizArea").style.display="block";

showQuestion();

}

document.getElementById("startQuizBtn").onclick=startQuiz;

function showQuestion(){

const q=playing[current];

document.getElementById("questionNumber").textContent=
`${current+1} / ${playing.length}`;

document.getElementById("questionTitle").textContent=q.question;

document.getElementById("progressBar").style.width=
(current/playing.length*100)+"%";

const answers=document.getElementById("answers");

answers.innerHTML="";

q.choices.forEach((choice,index)=>{

const btn=document.createElement("button");

btn.className="answerBtn";

btn.textContent=choice;

btn.onclick=()=>selectAnswer(btn,index);

answers.appendChild(btn);

});

}

function selectAnswer(button,index){

const q=playing[current];

const buttons=[...document.querySelectorAll(".answerBtn")];

buttons.forEach(b=>b.disabled=true);

buttons[q.answer].classList.add("correct");

if(index===q.answer){

score++;

}else{

button.classList.add("wrong");

}

setTimeout(()=>{

if(q.explanation){

alert(q.explanation);

}

current++;

if(current>=playing.length){

finishQuiz();

}else{

showQuestion();

}

},700);

}

function finishQuiz(){

document.getElementById("quizArea").style.display="none";
document.getElementById("result").style.display="block";

document.getElementById("progressBar").style.width="100%";

const percent=Math.round(score/playing.length*100);

document.getElementById("scoreText").innerHTML=
`${score} / ${playing.length}<br>${percent}%`;

}

document.getElementById("retryBtn").onclick=startQuiz;

document.getElementById("backBtn").onclick=()=>{

document.getElementById("quizArea").style.display="none";
document.getElementById("result").style.display="none";
document.getElementById("home").style.display="block";

};

document.getElementById("exportBtn").onclick=()=>{

updatePreview();

const blob=new Blob(
[
JSON.stringify(quiz,null,2)
],
{
type:"application/json"
}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download=(quiz.title||"quiz")+".json";

a.click();

URL.revokeObjectURL(a.href);

};

document.getElementById("importFile").onchange=e=>{

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=()=>{

try{

quiz=JSON.parse(reader.result);

document.getElementById("quizTitleInput").value=quiz.title||"";
document.getElementById("quizDescription").value=quiz.description||"";

renderEditor();

}catch{

alert("読み込みに失敗しました");

}

};

reader.readAsText(file);

};

renderEditor();

</script>

</body>
</html>
