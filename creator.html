<html lang="ja">

<head>

<title>クイズ作成</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="topbar">

    <button class="back" onclick="location.href='index.html'">
        ← 戻る

    <h1>クイズ作成</h1>

</header>



<main class="creator">


<section class="box">


<h2>クイズ情報</h2>


<label>
クイズ名
</label>

<input 
id="quizName"
type="text"
placeholder="例：日本の歴史クイズ">



</section>




<section class="box">


<h2>問題</h2>


<div id="questions">


<!-- 問題がここに追加される -->


</div>

＋ 問題を追加
</button>



</section>




<button id="saveQuiz" class="save">

💾 保存

</button>


</main>
