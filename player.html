<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>クイズ回答</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/player.css">

</head>


<body>


<header class="topbar">

    <button class="back" onclick="location.href='index.html'">
        ← 戻る
    </button>

    <h1>回答モード</h1>

</header>




<main class="player">


<section class="box">


<h2>クイズを選択</h2>


<select id="quizSelect">

</select>


<button id="startQuiz">
▶ スタート
</button>


</section>





<section id="quizArea" class="box hidden">


<h2 id="questionNumber"></h2>


<div id="questionText">

</div>



<div id="answerArea">

</div>



<button id="submitAnswer">

決定

</button>


</section>





<section id="resultArea" class="box hidden">


<h2>結果</h2>


<p id="score">

</p>


<button onclick="location.reload()">

もう一度

</button>


</section>


</main>



<script src="js/storage.js"></script>
<script src="js/player.js"></script>


</body>

</html>
